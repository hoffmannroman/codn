# A program beside the build of codn, with a lock of its own: nothing of
# it is in codn's `Cargo.lock` or in its binary. See src/main.rs.
[package]
name = "codn-grammars"
version = "0.0.0"
edition = "2024"
publish = false

# Its own root, so that cargo does not look for one above.
[workspace]

[dependencies]
# The version and the engine codn is to use. `yaml-load` reads grammars
# from their sources, which only this program does.
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy", "yaml-load"] }

# As codn is built, or the numbers are those of another program.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
